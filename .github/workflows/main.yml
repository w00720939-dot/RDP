 name: Windows RDP V2

on:
  workflow_dispatch:

jobs:
  windows-rdp:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10

    steps:
      - name: Connect Tailscale
        shell: powershell
        env:
          TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
            throw "Tailscale is not installed"
          }

          & $ts up --authkey=$env:TS_AUTH_KEY

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed"
          }

      - name: Configure Secure RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" -Value 0

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" -Value 1

          New-NetFirewallRule `
            -DisplayName "RDP-Tailscale-Only" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress "100.64.0.0/10" `
            -Action Allow `
            -ErrorAction SilentlyContinue

          Start-Service TermService

      - name: Verify RDP
        shell: powershell
        run: |
          $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4

          Write-Host "Tailscale IP: $ip"

          $rdp = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $rdp) {
            throw "RDP is not listening"
          }

          Write-Host "RDP service is ready"
          Write-Host "Use your authorized Windows account."
